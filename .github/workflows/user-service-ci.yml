name: ShopSphere User Service CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "user-service/**"
      - ".github/workflows/user-service-ci.yml"

  push:
    branches:
      - main
    paths:
      - "user-service/**"
      - ".github/workflows/user-service-ci.yml"

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  validate:
    name: Validate User Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r user-service/requirements.txt

      - name: Validate FastAPI application
        working-directory: ./user-service
        run: |
          python -m compileall -q app
          python -c "from app.main import app; print('FastAPI application imported successfully')"
  build:
    name: Build User Service Docker Image
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ARM64 Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./user-service
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ghcr.io/tksabins/shopsphere-user-service:${{ github.sha }}