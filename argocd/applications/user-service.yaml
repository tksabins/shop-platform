apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopsphere-user-service
  namespace: argocd
spec:
  project: shopsphere
  source:
    repoURL: https://github.com/tksabins/shop-platform.git
    targetRevision: main
    path: k8s/user-service-invalid
  destination:
    server: https://kubernetes.default.svc
    namespace: shopsphere
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: user-service
      namespace: shopsphere
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - RespectIgnoreDifferences=true
