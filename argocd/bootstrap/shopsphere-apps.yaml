apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shopsphere-apps
  namespace: argocd
spec:
  project: shopsphere-bootstrap
  source:
    repoURL: https://github.com/tksabins/shop-platform.git
    targetRevision: main
    path: argocd/applications
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
